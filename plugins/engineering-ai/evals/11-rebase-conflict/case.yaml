schema_version: "1.1"
name: 11-rebase-conflict
description: >-
  Feature branch has diverged from main with a predictable conflict -> read-only rebase plan, then stop for approval.
expected_outcome: >-
  Lists the 2 commits to replay and the 2 commits main gained, predicts the conflict in src/cart.js, proposes a backup branch and `npm test` for verification, and asks for approval without rebasing, merging or editing.
tags: [git, conflicts, approval]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    /engineering-ai:resolve-conflicts main
