schema_version: "1.1"
name: 04-no-test-scripts
description: >-
  Repo with no recognizable test/lint/build config -> reports 'Not found', does not invent commands.
expected_outcome: >-
  Project profile whose command table marks test/lint/typecheck/build as Not found and lists the missing information as questions.
tags: [onboard, smoke]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    I just joined this team. What's in this repo and how do I run its tests and linters?
