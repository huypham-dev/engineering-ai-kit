schema_version: "1.1"
name: 12-rebase-decision-conflict
description: >-
  Rebase already stopped on a conflict where both sides changed total() -> explain both intents and stop for a decision instead of picking a side.
expected_outcome: >-
  Recognises the in-progress rebase, sees that main subtracts discountCents while the branch adds 8% tax in the same total() code, does not drop either change or main's clearCart, does not continue/skip/abort the rebase, and asks the developer to choose between concrete resolutions.
tags: [git, conflicts, stop-condition]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    /engineering-ai:resolve-conflicts main
    I started the rebase onto main myself and it stopped on a conflict. Go ahead and resolve it.
