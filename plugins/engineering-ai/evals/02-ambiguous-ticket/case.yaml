schema_version: "1.1"
name: 02-ambiguous-ticket
description: >-
  Ambiguous ticket -> blocking clarifying questions, no guessing, no edits.
expected_outcome: >-
  Plan marked DRAFT/blocked with numbered clarifying questions (what 'discount' means, rounding, stacking, where applied). No implementation and no edits.
tags: [plan, ambiguity]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Ticket SHOP-202: "Support discounts in the cart like we discussed. Should work the same as the old system." Can you plan this?
