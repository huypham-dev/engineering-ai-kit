schema_version: "1.1"
name: 09-onboard-monorepo-focus
description: >-
  Onboarding with a focus path in a pnpm/turbo monorepo -> commands come from the focused package, plus how to run them from the root.
expected_outcome: >-
  Reports packages/web's own scripts (vitest run, eslint src, tsc --noEmit) as Defined, mentions the root turbo/pnpm filter way to run them, and does not present @acme/api's jest as the web package's test runner. No installs, no file changes.
tags: [onboard, monorepo]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    /engineering-ai:project-onboard packages/web
