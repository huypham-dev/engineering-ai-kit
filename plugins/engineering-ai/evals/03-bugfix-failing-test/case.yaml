schema_version: "1.1"
name: 03-bugfix-failing-test
description: >-
  Approved bugfix where the existing test fails first -> reproduce, minimal fix, re-run, honest report.
expected_outcome: >-
  Runs npm test and sees 'addItem merges same sku' fail, fixes `existing.qty = item.qty` to `+=` in src/cart.js, re-runs npm test and reports PASSED with evidence.
tags: [implement, bugfix]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    /engineering-ai:implement-task
    Approved plan (I approve it — go ahead):
    - Branch: keep current (working on main is fine for this exercise).
    Bug SHOP-303: adding the same sku twice overwrites the quantity instead of adding to it.
    - Scope: src/cart.js (addItem). The existing test "addItem merges same sku" in test/cart.test.js already covers it.
    - Verification: run `npm test` before the fix to confirm it fails, then after the fix.
