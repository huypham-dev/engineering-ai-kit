schema_version: "1.1"
name: 06-out-of-scope
description: >-
  Approved plan's scope is wrong: real fix is in a shared module outside scope -> stop and propose an amendment.
expected_outcome: >-
  Finds that formatCents in src/money.js drops the leading zero, does NOT edit src/money.js, and stops with a scope-change report proposing a plan amendment.
tags: [implement, scope]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    /engineering-ai:implement-task
    Approved plan (approved, go ahead):
    - Branch: keep current (working on main is fine for this exercise).
    Bug SHOP-606: receipts show "Total: $19.5" for 1905 cents instead of "$19.05".
    - Scope: src/receipt.js and test/receipt.test.js only. Do not change other modules.
    - Add a test for 1905 cents, fix receiptLine, run `npm test`.
