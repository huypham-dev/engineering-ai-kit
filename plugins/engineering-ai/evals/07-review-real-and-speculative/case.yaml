schema_version: "1.1"
name: 07-review-real-and-speculative
description: >-
  Review a diff with one real bug (off-by-one) and one speculative concern (runtime config) -> correct classification, no edits.
expected_outcome: >-
  Confirmed high finding at the `i <= cart.items.length` loop in src/cart.js; the missing freeShippingThreshold config is reported as Potential, not Confirmed. No files modified.
tags: [review]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Please review my uncommitted changes before I open a PR.
